name: Design system guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-and-visual:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: component-library
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: component-library/package-lock.json

      - run: npm ci
      - run: npm run check:design-system
      - run: npm exec -- tsc --noEmit
      - run: npm run lint:design-system

      - name: Run visual checks affected by this change
        if: github.event_name != 'workflow_dispatch'
        env:
          VISUAL_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:visual:changed -- --base "$env:VISUAL_BASE" --install

      - name: Run the full visual suite manually
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm exec playwright install chromium
          npm run test:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-failure
          path: |
            component-library/test-results
            component-library/playwright-report
          if-no-files-found: ignore
          retention-days: 7
